[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seerflow"
version = "0.2.0"
description = "Streaming log intelligence agent — detects operational failures and security threats with online ML"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
authors = [{ name = "Fernando Flores", email = "ferjflores@gmail.com" }]
keywords = ["log-analysis", "anomaly-detection", "siem", "observability", "streaming", "machine-learning", "syslog", "opentelemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: Security",
    "Typing :: Typed",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
]

dependencies = [
    "aiohttp>=3.13.3",
    "aiosqlite>=0.22.1",
    "drain3>=0.9.11",
    "grpcio>=1.78.0",
    "msgspec>=0.20.0",
    "opentelemetry-proto>=1.40.0",
    "pyyaml>=6.0.3",
    "river>=0.23.0",
    "watchfiles>=1.1.1",
]

[project.urls]
Homepage = "https://github.com/seerflow/seerflow"
Repository = "https://github.com/seerflow/seerflow"
Issues = "https://github.com/seerflow/seerflow/issues"
Documentation = "https://github.com/seerflow/seerflow/blob/main/SETTINGS.md"

[project.scripts]
seerflow = "seerflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seerflow"]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "bandit>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "types-pyyaml>=6.0.12.20250915",
    "pytest-benchmark>=5.2.3",
    "types-grpcio>=1.0.0.20251009",
    "types-protobuf>=6.32.1.20260221",
]

[tool.ruff]
target-version = "py313"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "S",     # flake8-bandit
    "T20",   # flake8-print
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = [
    "S101",  # assert allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["drain3.*", "igraph.*", "river.*", "aiosqlite.*", "scipy.*"]
ignore_missing_imports = true

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers -m 'not slow' --benchmark-min-rounds=10"
markers = [
    "benchmark: performance benchmarks",
    "slow: heavyweight benchmarks, run with pytest -m slow",
]

[tool.coverage.run]
source = ["src/seerflow"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
