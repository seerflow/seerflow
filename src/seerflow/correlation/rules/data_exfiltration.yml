name: data-exfiltration
description: "Unusual outbound data transfer combined with file access from the same IP — potential data exfiltration"
entity_type: ip
window_seconds: 900
min_sources: 2
alert_severity: 5
mitre_tactics:
  - exfiltration
mitre_techniques:
  - T1048
sources:
  - source_type: syslog
    conditions:
      message: "(?i)(large[^\n]{0,200}transfer|upload[^\n]{0,200}completed?|exfil|outbound[^\n]{0,200}bytes|sent[^\n]{0,200}\\d{6,}|POST[^\n]{0,200}\\d{6,})"
    min_count: 3
  - source_type: syslog
    conditions:
      message: "(?i)(file[^\n]{0,200}access|read[^\n]{0,200}sensitive|scp\\b|rsync\\b|tar\\b|zip\\b|curl[^\n]{0,200}upload|wget[^\n]{0,200}post)"
    min_count: 2
