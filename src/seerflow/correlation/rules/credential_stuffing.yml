name: credential-stuffing
description: "High volume of authentication failures from a single IP — potential credential stuffing attack"
entity_type: ip
window_seconds: 300
min_sources: 1
alert_severity: 4
mitre_tactics:
  - credential-access
mitre_techniques:
  - T1110.004
sources:
  - source_type: syslog
    conditions:
      message: "(?i)(authentication fail|login fail|invalid password|failed password|access denied)"
    min_count: 10
