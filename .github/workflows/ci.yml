name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.11"]') || fromJSON('["3.11", "3.12", "3.13", "3.14"]') }}
    permissions:
      contents: write  # required by benchmark-action auto-push to gh-pages
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra tui

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/

      - name: Security scan
        run: uv run bandit -r src/ -c pyproject.toml

      - name: Tests with coverage
        run: uv run pytest --cov=src/seerflow --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=95 -v

      - name: Coverage summary
        if: success()
        run: |
          echo "## Test Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --show-missing --skip-covered >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Run benchmarks
        run: |
          uv run pytest tests/benchmarks/ -m benchmark --benchmark-only \
            --benchmark-json=benchmark-results.json \
            --benchmark-columns=min,max,mean,rounds -q

      - name: Benchmark summary
        if: success()
        run: |
          echo "## Benchmark Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for b in data.get('benchmarks', []):
              name = b['name']
              mean = b['stats']['mean'] * 1000
              print(f'{name}: {mean:.1f}ms mean')
          " >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Benchmark history publishing is disabled until a gh-pages branch is
      # provisioned on the repo. The github-action-benchmark step always
      # fetches `gh-pages` (even with auto-push: false) to compare against
      # historical data, and the missing branch makes it fail. Re-enable
      # this step once gh-pages exists.
      - name: Store benchmark result
        if: false
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba  # v1.22.1
        with:
          tool: 'pytest'
          output-file-path: benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: '110%'
          comment-on-alert: true
          fail-on-alert: false
          benchmark-data-dir-path: 'benchmarks'

  frontend-e2e:
    # Path-filtered (see `filter` step) so Python-only PRs skip the job.
    # Runs on pull_request + push; dev / main runs catch drift outside PRs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'src/seerflow/web/**'
              - '.github/workflows/ci.yml'

      - name: Set up Node
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm deps
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Resolve Playwright version
        if: steps.filter.outputs.frontend == 'true'
        id: pw-version
        working-directory: frontend
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.filter.outputs.frontend == 'true'
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.filter.outputs.frontend == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.filter.outputs.frontend == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Build frontend
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build

      - name: Run Playwright (e2e project)
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        env:
          RUN_E2E: '1'
        run: npx playwright test --project=e2e

      - name: Run Playwright (quarantine project, non-blocking)
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        continue-on-error: true
        env:
          RUN_E2E: '1'
        run: npx playwright test --project=quarantine

      - name: Upload Playwright artefacts on failure
        # `always()` so a failed quarantine step (which runs with
        # `continue-on-error: true` and therefore does not fail the job)
        # still uploads its trace. The `if:` cost is one empty upload on
        # green runs, which the `if-no-files-found: ignore` guard zeros out.
        if: steps.filter.outputs.frontend == 'true' && always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  scorecard-gate:
    # S-310 / FR-078 / NFR-016. Independent of `check` (no `needs:`) so it can
    # never block sibling PRs. Synthetic subset only (~200 LANL events + a
    # small synthetic pipeline benchmark) => fast. The pass/fail gate logic is
    # self-contained in src/seerflow/benchmark/scorecard.py and compares
    # against the committed tests/fixtures/scorecard_baseline.json baseline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra tui

      - name: Scorecard regression gate (synthetic subset)
        run: |
          uv run python -m seerflow.benchmark.scorecard \
            --out benchmark-results.json \
            --check tests/fixtures/scorecard_baseline.json

      - name: Upload scorecard artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-scorecard-${{ github.run_id }}
          path: benchmark-results.json
          if-no-files-found: ignore
          retention-days: 14
