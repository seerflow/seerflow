name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to PyPI
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build React dashboard
        run: ./build_frontend.sh

      - name: Build package
        run: uv build

      - name: Install dependencies
        run: uv sync --extra tui

      # tag -> build -> TEST -> publish. A broken build can never reach PyPI:
      # the same quality gate enforced on every PR runs here against the
      # built tree before the upload step.
      - name: Quality gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/
          uv run bandit -r src/ -c pyproject.toml
          uv run pytest --cov=src/seerflow --cov-fail-under=95 -q

      # PyPI rejects malformed long descriptions at upload time; running the
      # exact check here fails the release loudly instead.
      - name: Verify distribution metadata
        run: uv run twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
