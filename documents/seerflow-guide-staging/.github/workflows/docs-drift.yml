name: docs-drift

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - '.github/workflows/docs-drift.yml'
  schedule:
    # Weekly fail-loud: catches drift introduced by upstream `seerflow` merges
    # that landed without a docs-side PR. Mondays 12:00 UTC.
    - cron: '0 12 * * 1'

permissions:
  contents: read
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install docs project + seerflow from upstream
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install "seerflow @ git+https://github.com/seerflow/seerflow@main"

      - name: Run drift check
        id: drift
        run: |
          set +e
          python scripts/check_docs_drift.py \
            --docs-dir docs \
            --report-path drift-report.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift-report.json
          if-no-files-found: ignore

      - name: Post PR comment on drift
        if: github.event_name == 'pull_request' && steps.drift.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'drift-report.json';
            if (!fs.existsSync(path)) {
              core.setFailed('drift-report.json not produced — drift script crashed before writing it');
              return;
            }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const lines = ['## Docs drift detected', ''];
            for (const [section, label] of [['config', 'Config drift'], ['cli', 'CLI drift']]) {
              if (!report[section]) continue;
              const block = report[section];
              lines.push(`### ${label} — ${block.ok ? 'OK' : 'DRIFT'}`);
              if (block.extra_in_docs.length) {
                lines.push('**Extra in docs (failures):**');
                for (const k of block.extra_in_docs) lines.push(`- \`${k}\``);
              }
              if (block.missing_in_docs.length) {
                lines.push('**Missing in docs (warnings):**');
                for (const k of block.missing_in_docs) lines.push(`- \`${k}\``);
              }
              lines.push('');
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });

      - name: Fail the workflow on drift
        if: steps.drift.outputs.exit_code != '0'
        run: exit 1
