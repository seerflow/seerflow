# ===========================================================================
# Top-level scalars
# ===========================================================================
dashboard_port: 8080
health_bind_address: "127.0.0.1"         # bind address for the health endpoint; use 0.0.0.0 for container access
log_level: INFO                          # DEBUG | INFO | WARNING | ERROR | CRITICAL
# shutdown_timeout_s: 30.0               # graceful-drain budget on SIGTERM (matches k8s terminationGracePeriodSeconds)

# WebSocket dashboard stream tuning (ws_*)
# ws_max_connections: 20                 # max concurrent dashboard WebSocket clients
# ws_queue_maxlen: 1000                  # per-connection outbound buffer depth
# ws_tick_interval_s: 0.01               # event-drain tick interval
# ws_batch_max_events: 10                # max events flushed per tick
# ws_status_interval_s: 5.0              # status-frame cadence
# ws_allowed_origins:                    # explicit Origin allowlist (empty = localhost defaults)
#   - https://seerflow.internal.example.com
# ws_filter_min_interval_ms: 100         # min interval between live-filter re-applies

# REST API hardening (api_*)
# api_rate_limit_enabled: true
# api_rate_limit_redis_url: ${SEERFLOW_RATELIMIT_REDIS_URL}  # secret via env var; empty = in-memory limiter
# api_allowed_origins:                   # CORS allowlist (empty = same-origin only)
#   - https://seerflow.internal.example.com
# api_list_rate_limit: "60/minute"       # list-endpoint rate limit
# api_detail_rate_limit: "300/minute"    # detail-endpoint rate limit
# api_coverage_rate_limit: "10/minute"   # coverage-endpoint rate limit
# api_trust_proxy_headers: false         # honor X-Forwarded-For (enable only behind a trusted proxy)
