# Seerflow Configuration — annotated reference
#
# All settings are OPTIONAL — sensible defaults are used when omitted, so
# this file is runnable as-is (copy it to seerflow.yaml). Uncomment and
# edit only the knobs you need.
#
# Secrets and environment-specific values use ${ENV_VAR} or
# ${ENV_VAR:-default} interpolation. NEVER put a literal secret in this
# file — always reference an environment variable.
#
# Default config file: seerflow.yaml in the current working directory.
# Full per-key reference: docs/settings-reference.md
# SQLite -> PostgreSQL runbook: STORAGE_MIGRATION.md

# ===========================================================================
# storage — event/alert/model persistence
# ===========================================================================
storage:
  backend: sqlite                        # sqlite | postgresql

  # SQLite (default, zero-config) — single-writer, WAL mode, FTS5
  # data_dir: ~/.local/share/seerflow    # default XDG data dir; override with ${SEERFLOW_DATA_DIR}
  # sqlite_path: auto-derived from data_dir (data_dir/seerflow.db)

  # PostgreSQL (production-scale) — install with: uv sync --extra postgres
  # See STORAGE_MIGRATION.md for the SQLite -> PostgreSQL runbook.
  # postgresql_url: ${SEERFLOW_PG_URL}        # required when backend=postgresql
  # postgresql_pool_min_size: 2               # asyncpg pool floor; >= 1
  # postgresql_pool_max_size: 10              # asyncpg pool ceiling; >= pool_min_size
  # postgresql_command_timeout_s: 30.0        # per-query timeout in seconds; > 0

  # Entity-graph backend (S-155). ``igraph`` is the in-process default;
  # ``falkordb`` (S-155-F1) is available with ``uv sync --extra
  # graph-falkordb`` and a ``falkordb_url`` below. ``postgres_age``
  # (S-155-F2) is available with ``uv sync --extra graph-postgres-age``
  # and reuses ``postgresql_url`` above — AGE lives inside the same
  # Postgres instance, no separate DSN. The AGE extension must be
  # installed on the server (``CREATE EXTENSION age``); on managed
  # Postgres services confirm AGE is in the provider's allowlist first.
  # To move an existing entity graph between backends use the migration
  # CLI (S-155-F3):
  #   seerflow graph migrate --from igraph --to falkordb
  #   seerflow graph migrate --from falkordb --to igraph     # downgrade
  # See ``seerflow graph migrate --help`` for --dry-run and
  # --wipe-destination flags.
  # graph_backend: igraph                     # igraph | falkordb | postgres_age
  # falkordb_url: ${SEERFLOW_FALKORDB_URL:-falkor://localhost:6379}  # required when graph_backend=falkordb

# ===========================================================================
# receivers — log ingestion endpoints
# ===========================================================================
receivers:
  # Network binding
  bind_addr: "0.0.0.0"                   # address to bind all receivers; use 127.0.0.1 to restrict to localhost
  queue_maxsize: 10000                   # internal event queue depth before back-pressure

  # Syslog receiver. Defaults below use non-privileged ports so Seerflow
  # runs without root. The IANA syslog ports are 514 (UDP) / 601 (TCP) —
  # use those only when running as root or with cap_net_bind_service.
  syslog_enabled: true                   # enable UDP + TCP syslog listener
  syslog_udp_port: 5514                  # UDP syslog port (use 514 with root/cap_net_bind)
  syslog_tcp_port: 5601                  # TCP syslog port (use 601 with root/cap_net_bind)
  syslog_tcp_enabled: true               # set false to disable TCP syslog while keeping UDP

  # OpenTelemetry gRPC receiver
  otlp_grpc_enabled: true
  otlp_grpc_port: 4317                   # standard OTLP/gRPC port
  otlp_grpc_max_workers: 4               # gRPC thread-pool size

  # OpenTelemetry HTTP receiver
  otlp_http_enabled: true
  otlp_http_port: 4318                   # standard OTLP/HTTP port
  otlp_http_max_request_bytes: 4194304   # 4 MiB max request body; raise for high-volume batches

  # File tailing
  # file_paths:                          # glob patterns for file tailing
  #   - /var/log/*.log
  #   - /var/log/auth.log
  # file_checkpoint_dir: ""              # dir to persist tail offsets across restarts (empty = no persistence)
  # file_debounce_ms: 1600               # milliseconds to wait after last write before re-reading

  # Webhook HTTP receiver
  webhook_enabled: false                 # enable the inbound webhook listener
  webhook_port: 8081                     # port for the webhook HTTP server
  # webhooks:
  #   - path: /ingest/github
  #     auth_header: X-Hub-Signature-256
  #     auth_token: ${GITHUB_WEBHOOK_SECRET}   # secret via env var only
  #     source_id: github
  #     field_mapping:
  #       message: action

  # Access control
  # allowed_log_roots:                   # restrict file_paths to these directory prefixes
  #   - /var/log
  #   - /home

# ===========================================================================
# detection — ML anomaly detectors + blended scoring
# ===========================================================================
detection:
  # Sigma rules — 63 bundled rules loaded automatically; add custom directories below
  # sigma_rules_dirs:
  #   - /etc/seerflow/sigma-rules
  #   - /opt/custom-rules
  # sigma_custom_upload_dir: ~/.local/share/seerflow/sigma-custom  # dashboard-uploaded rules persist here

  # Half-Space Trees (content anomaly)
  hst_window_size: 1000
  hst_n_trees: 25

  # DSPOT auto-threshold (extreme value theory)
  dspot:
    calibration_window: 1000             # minimum events before DSPOT activates
    risk_level: 0.0001                   # false positive rate (1 in 10,000)
    initial_percentile: 98               # seed percentile for DSPOT threshold initialization
  # dspot_threshold_cap_multiplier: 5.0  # cap DSPOT threshold at N x the calibrated level

  # Blended score weights — ratios only; the pipeline divides by their sum
  weights_content: 0.30                  # Half-Space Trees weight
  weights_volume: 0.25                   # Holt-Winters weight
  weights_sequence: 0.25                 # Markov chains weight
  weights_pattern: 0.20                  # CUSUM weight
  # weights_template_volume: 0.15        # per-template volume sub-signal weight
  # weights_entity_volume: 0.15          # per-entity volume sub-signal weight

  # Holt-Winters (volume anomaly)
  # hw_seasonal_period: 1440             # buckets per season (1440 = 1-min buckets over 24h)
  # hw_alpha: 0.3                        # level smoothing
  # hw_beta: 0.1                         # trend smoothing
  # hw_gamma: 0.1                        # seasonal smoothing
  # hw_n_std: 3.0                        # alert when residual exceeds N standard deviations

  # CUSUM (change-point detection)
  # cusum_drift: 0.5                     # allowable drift before accumulation
  # cusum_threshold: 5.0                 # cumulative-sum alert threshold
  # cusum_ema_alpha: 0.1                 # EMA smoothing for the running baseline
  # cusum_warmup_buckets: 30             # buckets observed before CUSUM may alert

  # Markov chains (sequence anomaly)
  # markov_smoothing: 0.000001           # Laplace smoothing for unseen transitions
  # markov_min_events: 100               # minimum events before a chain may score
  # markov_max_entities: 1000            # LRU cap on per-entity chains

  # Risk accumulation
  # risk_half_life_hours: 4              # exponential decay half-life for accumulated risk
  # risk_threshold: 50.0                 # risk score that triggers an alert
  # risk_max_entities: 10000             # LRU cap on tracked risk entities

  # Capacity / cadence
  # max_sources: 256                     # LRU cap on distinct log sources modelled
  # max_template_hw: 500                 # LRU cap on per-template Holt-Winters models
  # max_entity_hw: 500                   # LRU cap on per-entity Holt-Winters models
  # min_events_for_scoring: 50           # warm-up before any score is emitted
  # score_interval: 1                    # score every Nth event per source (1 = every event)
  # graph_algo_interval: 500             # run graph-structural algorithms every N events
  # model_save_interval_seconds: 300     # persist ML model state every N seconds

  # Graph-structural correlation thresholds
  # graph_structural:
  #   community_crossing_enabled: true   # flag entities that bridge graph communities
  #   betweenness_threshold: 0.3         # normalized betweenness above which an entity is "central"
  #   fan_out_sigma: 3.0                 # alert when fan-out exceeds mean + N sigma
  #   fan_out_min_floor: 5               # never alert on fan-out below this absolute count
  #   fan_out_history_size: 20           # rolling window for the fan-out baseline

  # Kill-chain tactic progression
  # kill_chain:
  #   enabled: true
  #   tactic_threshold: 3                # distinct ATT&CK tactics before a kill-chain alert
  #   window_seconds: 86400              # progression window (24h)
  #   max_entities: 10000                # LRU cap on tracked kill-chain entities

# ===========================================================================
# correlation — entity-centric temporal correlation engine
# ===========================================================================
# correlation:
#   window_duration_seconds: 1800        # temporal join window (30 min)
#   max_events_per_entity: 1000          # ring-buffer cap per entity
#   max_entities: 10000                  # LRU cap on correlated entities
#   late_tolerance_seconds: 30           # watermark slack for out-of-order events
#   rule_dirs:                           # extra correlation-rule directories
#     - /etc/seerflow/correlation-rules

# ===========================================================================
# alerting — deduplication, routing, outbound channels, OTLP export
# ===========================================================================
alerting:
  dedup_window_seconds: 900              # 15 minutes
  # dedup_window_overrides:              # per-rule dedup overrides [[rule_id, seconds], ...]
  #   - ["bruteforce", 300]

  # Outbound webhooks (Slack/Teams/generic JSON)
  # webhooks:
  #   - url: ${SLACK_WEBHOOK_URL}        # secret via env var only
  #     format: slack
  #   - url: ${TEAMS_WEBHOOK_URL}
  #     format: teams
  #   - url: ${GENERIC_WEBHOOK_URL}      # generic JSON sink with auth header
  #     format: json
  #     headers:                         # optional custom headers; secrets via env
  #       Authorization: Bearer ${GENERIC_WEBHOOK_TOKEN}

  # PagerDuty Events API v2
  # pagerduty_routing_key: ${PAGERDUTY_ROUTING_KEY}   # secret via env var only

  # Dashboard deep-links embedded in outbound alerts
  # dashboard_url: https://seerflow.internal.example.com

  # OTLP alert export — emit alerts as OTLP logs to a collector/SIEM
  # otlp_endpoint: ${SEERFLOW_OTLP_ALERT_ENDPOINT}    # empty disables export
  # otlp_protocol: grpc                  # grpc | http
  # otlp_export_interval_seconds: 5
  # otlp_tls: null                       # null = auto; true/false to force
  # otlp_tls_ca_file: /etc/seerflow/otlp-ca.pem       # custom CA bundle (PEM)
  # otlp_mtls_cert_file: /etc/seerflow/otlp-client.pem
  # otlp_mtls_key_file: /etc/seerflow/otlp-client-key.pem
  # otlp_headers:                        # HTTP-transport auth headers; secrets via env
  #   Authorization: Bearer ${SEERFLOW_OTLP_TOKEN}

  # Declarative outbound sinks (S-361/FR-005, foundation for EPIC-001).
  # Each entry registers by unique name behind the shared dispatcher; an
  # unknown `type` or duplicate `name` fails config load. The formatter is
  # selectable per sink and decoupled from transport.
  # sinks:
  #   - type: console        # one of: console, file, otlp
  #     name: ops-console     # unique across sinks
  #     formatter: json       # one of: slack, teams, json
  #     min_severity: 3       # 0-6
  #   - type: file
  #     name: audit-file
  #     formatter: json
  #     options:              # transport-specific keys
  #       path: /var/log/seerflow/alerts.ndjson
  #   - type: otlp
  #     name: siem-collector
  #     formatter: json
  #     options:
  #       endpoint: ${SEERFLOW_OTLP_ALERT_ENDPOINT}   # required
  #       protocol: grpc      # grpc | http

# ===========================================================================
