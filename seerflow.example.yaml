# ===========================================================================
# ueba — user & entity behavior analytics
# ===========================================================================
# ueba:
#   enabled: true
#   warmup_days: 7                       # baseline learning window
#   warmup_min_events: 50                # minimum events before scoring an entity
#   max_entities: 100000                 # LRU cap on profiled entities
#   ema_alpha: 0.05                      # EMA smoothing for the behavioral baseline
#   source_ip_cap: 64                    # max distinct source IPs tracked per entity
#   template_top_k: 32                   # top-K log templates retained per entity
#   score_threshold: 0.75                # composite score that triggers a UEBA alert
#   alert_cooldown_seconds: 900          # per-entity alert cooldown
#   sub_score_weights:                   # must sum to 1.0 +/- 1e-6
#     time_of_day: 0.25
#     source_novelty: 0.30
#     volume: 0.20
#     pattern_novelty: 0.25

