#   cloud_api_key: ${SEERFLOW_LLM_API_KEY}   # secret via env var only
#   cloud_model: ""
#   cloud_base_url: ""
#   cloud_timeout_s: 30.0
#
#   # llama_cpp tuning
#   n_ctx: 4096
#   n_threads: null                      # null = auto-detect
#   n_gpu_layers: 0
#   max_tokens_default: 256
#   temperature_default: 0.2
#   seed: 42
#
#   # Alert-explanation cache/limits
#   explanation_cache_size: 256
#   explanation_cache_ttl_s: 3600
#   explanation_max_contributing_events: 8
#   explanation_max_prompt_chars: 8000
#   explanation_timeout_s: 12.0
