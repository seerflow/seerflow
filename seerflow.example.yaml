# Seerflow Configuration
# All settings are optional — sensible defaults are used when omitted.
# Use ${ENV_VAR} or ${ENV_VAR:-default} for secrets and environment-specific values.
# Default config file: seerflow.yaml in the current working directory.

storage:
  backend: sqlite                        # sqlite | postgresql
  # data_dir: ~/.local/share/seerflow    # default XDG data dir; override with ${SEERFLOW_DATA_DIR}
  # sqlite_path: auto-derived from data_dir (data_dir/seerflow.db)
  # postgresql_url: ${SEERFLOW_PG_URL}   # required when backend=postgresql

receivers:
  # Network binding
  bind_addr: "0.0.0.0"                   # address to bind all receivers; use 127.0.0.1 to restrict to localhost
  queue_maxsize: 10000                   # internal event queue depth before back-pressure

  # Syslog receiver
  syslog_enabled: true                   # enable UDP + TCP syslog listener
  syslog_udp_port: 5514                  # UDP syslog port (use 514 with root/cap_net_bind)
  syslog_tcp_port: 5601                  # TCP syslog port (use 601 with root/cap_net_bind)
  syslog_tcp_enabled: true               # set false to disable TCP syslog while keeping UDP

  # OpenTelemetry gRPC receiver
  otlp_grpc_enabled: true
  otlp_grpc_port: 4317                   # standard OTLP/gRPC port
  otlp_grpc_max_workers: 4              # gRPC thread-pool size

  # OpenTelemetry HTTP receiver
  otlp_http_enabled: true
  otlp_http_port: 4318                   # standard OTLP/HTTP port
  otlp_http_max_request_bytes: 4194304  # 4 MiB max request body; raise for high-volume batches

  # File tailing
  # file_paths:                          # glob patterns for file tailing
  #   - /var/log/*.log
  #   - /var/log/auth.log
  # file_checkpoint_dir: ""              # dir to persist tail offsets across restarts (empty = no persistence)
  # file_debounce_ms: 1600               # milliseconds to wait after last write before re-reading

  # Webhook HTTP receiver
  webhook_enabled: false                 # enable the inbound webhook listener
  webhook_port: 8081                     # port for the webhook HTTP server
  # webhooks:
  #   - path: /ingest/github
  #     auth_header: X-Hub-Signature-256
  #     auth_token: ${GITHUB_WEBHOOK_SECRET}
  #     source_id: github
  #     field_mapping:
  #       message: action

  # Access control
  # allowed_log_roots:                   # restrict file_paths to these directory prefixes
  #   - /var/log
  #   - /home

detection:
  # Sigma rules — 63 bundled rules loaded automatically; add custom directories below
  # sigma_rules_dirs:
  #   - /etc/seerflow/sigma-rules
  #   - /opt/custom-rules

  hst_window_size: 1000
  hst_n_trees: 25
  dspot:
    calibration_window: 1000             # minimum events before DSPOT activates
    risk_level: 0.0001                   # false positive rate (1 in 10,000)
    initial_percentile: 98               # seed percentile for DSPOT threshold initialization
  weights_content: 0.30                  # Half-Space Trees weight
  weights_volume: 0.25                   # Holt-Winters weight
  weights_sequence: 0.25                 # Markov chains weight
  weights_pattern: 0.20                  # CUSUM weight

alerting:
  dedup_window_seconds: 900              # 15 minutes
  # webhooks:
  #   - url: ${SLACK_WEBHOOK_URL}
  #     format: slack
  #   - url: ${TEAMS_WEBHOOK_URL}
  #     format: teams
  # pagerduty_routing_key: ${SEERFLOW_PD_KEY}

# llm:
#   backend: llamacpp                    # llamacpp | ollama | cloud
#   model_path: ~/.cache/seerflow/phi-4-mini-Q4_K_M.gguf
#   ollama_url: http://localhost:11434

dashboard_port: 8080
log_level: INFO                          # DEBUG | INFO | WARNING | ERROR
